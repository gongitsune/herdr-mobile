[versions]
agp = "8.9.1"
kotlin = "2.1.20"
# Latest stable BOM compatible with this SDK/AGP toolchain (newer BOMs need SDK 37).
compose = "2026.06.01"
# Stable 1.4 omits Expressive; alpha19+ requires SDK 37 / AGP 9.1.
material3 = "1.5.0-alpha18"
[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.8.9" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.1.4" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.9.0" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.9.0" }
markdown-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version = "0.33.0" }
